    <!-- =====================================================
         PERFORMANCE-FRIENDLY GOOGLE ANALYTICS
         Loads after interaction or after 8 seconds.
    ====================================================== -->

    <script>
      (function () {
        var analyticsLoaded = false;
        var analyticsTimer = 0;

        function removeInteractionListeners() {
          window.removeEventListener(
            "pointerdown",
            loadGoogleAnalytics
          );

          window.removeEventListener(
            "keydown",
            loadGoogleAnalytics
          );

          window.removeEventListener(
            "touchstart",
            loadGoogleAnalytics
          );

          window.removeEventListener(
            "scroll",
            loadGoogleAnalytics
          );
        }

        function loadGoogleAnalytics() {
          if (analyticsLoaded) {
            return;
          }

          analyticsLoaded = true;

          window.clearTimeout(
            analyticsTimer
          );

          removeInteractionListeners();

          var analyticsScript =
            document.createElement(
              "script"
            );

          analyticsScript.async = true;

          analyticsScript.src =
            "https://www.googletagmanager.com/gtag/js?id=G-5ZQQ9LNWJR";

          document.head.appendChild(
            analyticsScript
          );

          window.dataLayer =
            window.dataLayer || [];

          window.gtag = function () {
            window.dataLayer.push(
              arguments
            );
          };

          window.gtag(
            "js",
            new Date()
          );

          window.gtag(
            "config",
            "G-5ZQQ9LNWJR",
            {
              anonymize_ip: true,
              send_page_view: true
            }
          );
        }

        window.addEventListener(
          "pointerdown",
          loadGoogleAnalytics,
          {
            once: true,
            passive: true
          }
        );

        window.addEventListener(
          "keydown",
          loadGoogleAnalytics,
          {
            once: true
          }
        );

        window.addEventListener(
          "touchstart",
          loadGoogleAnalytics,
          {
            once: true,
            passive: true
          }
        );

        window.addEventListener(
          "scroll",
          loadGoogleAnalytics,
          {
            once: true,
            passive: true
          }
        );

        window.addEventListener(
          "load",
          function () {
            analyticsTimer =
              window.setTimeout(
                loadGoogleAnalytics,
                8000
              );
          },
          {
            once: true
          }
        );
      })();
    </script>
